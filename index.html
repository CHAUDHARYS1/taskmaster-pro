<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
    <title>Taskmaster Pro — Team Kanban Board</title>
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Real-time collaborative Kanban board with multi-workspace support, task assignments, due dates, and team presence. Free to use." />
    <meta property="og:title" content="Taskmaster Pro — Team Kanban Board" />
    <meta property="og:description" content="Real-time collaborative Kanban board with multi-workspace support, task assignments, due dates, and team presence." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskmaster12.netlify.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Taskmaster Pro — Team Kanban Board" />
    <meta name="twitter:description" content="Real-time collaborative Kanban board with multi-workspace support, task assignments, due dates, and team presence." />
    <link rel="canonical" href="https://taskmaster12.netlify.app/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Taskmaster Pro",
      "url": "https://taskmaster12.netlify.app/",
      "description": "Real-time collaborative Kanban board with multi-workspace support, task assignments, due dates, and team presence.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Real-time collaborative task board",
        "Multi-workspace and project support",
        "Task assignments and due dates",
        "Team presence and live editing indicators",
        "Dark mode"
      ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Taskmaster Pro" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
